<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Fútbol</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            font-family: Arial, sans-serif;
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .galeria img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            transition: 0.3s;
        }

        .galeria img:hover {
            transform: scale(1.05);
        }

        @media (max-width: 700px) {
            .galeria {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="galeria">

        <img src="imagenes/futbol1.jpg" alt="Fútbol">
        <img src="imagenes/futbol2.jpg" alt="Fútbol">
        <img src="imagenes/futbol3.jpg" alt="Fútbol">
        <img src="imagenes/futbol4.jpg" alt="Fútbol">
        <img src="imagenes/futbol5.jpg" alt="Fútbol">
        <img src="imagenes/futbol6.jpg" alt="Fútbol">
        <img src="imagenes/futbol7.jpg" alt="Fútbol">
        <img src="imagenes/futbol8.jpg" alt="Fútbol">
        <img src="imagenes/futbol9.jpg" alt="Fútbol">

    </div>

</body>
</html>

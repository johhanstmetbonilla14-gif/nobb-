<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            background: #111;
        }

        .galeria {
            max-width: 1200px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .galeria img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 18px;
            transition: 0.4s;
        }

        .galeria img:hover {
            transform: scale(1.04);
        }

        .grande {
            grid-column: span 2;
        }

        @media (max-width: 700px) {
            .galeria {
                grid-template-columns: 1fr;
            }

            .grande {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

    <div class="galeria">

        <img class="grande"
        src="https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1200&q=80">

        <img
        src="https://images.unsplash.com/photo-1526232761682-d26e03ac148e?auto=format&fit=crop&w=800&q=80">

        <img
        src="https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?auto=format&fit=crop&w=800&q=80">

        <img
        src="https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&w=800&q=80">

        <img
        src="https://images.unsplash.com/photo-1553778263-73a83bab9b0c?auto=format&fit=crop&w=800&q=80">

        <img
        src="https://images.unsplash.com/photo-1518091043644-c1d4457512c6?auto=format&fit=crop&w=800&q=80">

    </div>

</body>
</html>
